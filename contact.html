<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - My Blog</title>

    <link rel="stylesheet" href="css/Stylesheet.css">
</head>

<body>

    <header>
        <h1>My Blog</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <section>

            <h2>Contact Me</h2>

            <p>
                Fill out the form below to get in touch with me.
            </p>

            <form action="#" method="post">

                <div>
                    <label for="name">Name:</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div>
                    <label for="email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div>
                    <label for="age">Age:</label>
                    <input
                        type="number"
                        id="age"
                        name="age"
                        min="1"
                        max="120"
                    >
                </div>

                <div>
                    <label for="date">Preferred Date:</label>
                    <input
                        type="date"
                        id="date"
                        name="date"
                    >
                </div>

                <fieldset>

                    <legend>Choose your level</legend>

                    <div>
                        <input
                            type="radio"
                            id="beginner"
                            name="level"
                            value="beginner"
                            required
                        >
                        <label for="beginner">Beginner</label>
                    </div>

                    <div>
                        <input
                            type="radio"
                            id="intermediate"
                            name="level"
                            value="intermediate"
                        >
                        <label for="intermediate">Intermediate</label>
                    </div>

                    <div>
                        <input
                            type="radio"
                            id="advanced"
                            name="level"
                            value="advanced"
                        >
                        <label for="advanced">Advanced</label>
                    </div>

                </fieldset>

                <fieldset>

                    <legend>Choose your interests</legend>

                    <div>
                        <input
                            type="checkbox"
                            id="html"
                            name="interests"
                            value="html"
                        >
                        <label for="html">HTML</label>
                    </div>

                    <div>
                        <input
                            type="checkbox"
                            id="css"
                            name="interests"
                            value="css"
                        >
                        <label for="css">CSS</label>
                    </div>

                    <div>
                        <input
                            type="checkbox"
                            id="javascript"
                            name="interests"
                            value="javascript"
                        >
                        <label for="javascript">JavaScript</label>
                    </div>

                </fieldset>

                <div>
                    <label for="course">Favorite Course:</label>

                    <select id="course" name="course">

                        <option value="">Choose a course</option>
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                        <option value="javascript">JavaScript</option>

                    </select>
                </div>

                <div>
                    <label for="message">Message:</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        placeholder="Write your message here..."
                    ></textarea>
                </div>

                <button type="submit">
                    Send
                </button>

            </form>

        </section>

    </main>

    <footer>

        <p>
            &copy; 2026 My Blog
        </p>

    </footer>

</body>

</html>
